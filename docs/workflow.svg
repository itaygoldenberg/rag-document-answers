<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title"><title id="title">RAG Document Answers application workflow</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061411"/><stop offset="1" stop-color="#0e1825"/></linearGradient><radialGradient id="glow"><stop stop-color="#00ffcc" stop-opacity=".13"/><stop offset="1" stop-color="#00ffcc" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="1198" height="408" rx="22" fill="url(#bg)" stroke="#23433d"/><ellipse cx="980" cy="100" rx="400" ry="250" fill="url(#glow)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="49" font-size="13" fill="#00ffcc" letter-spacing="2">APPLICATION WORKFLOW</text><text x="40" y="91" font-size="30" fill="#f3faf7" font-weight="650">RAG Document Answers</text><path d="M290 211h40" stroke="#4c8b77" stroke-width="2"/><path d="m322 205 8 6-8 6" fill="none" stroke="#79c3a8"/><circle r="3" fill="#00ffcc"><animateMotion dur="2.8s" repeatCount="indefinite" path="M290 211h40"/></circle><rect x="40" y="131" width="250" height="164" rx="16" fill="#10231f" stroke="#315449"/><text x="60" y="165" font-size="13" fill="#00ffcc" font-weight="700">01</text><text x="60" y="202" font-size="16" fill="#e5f4ed" font-weight="700">LOCAL DOCUMENTS</text><text x="60" y="238" font-size="15" fill="#a8bfb6" >Read source files</text><text x="60" y="263" font-size="15" fill="#a8bfb6" >and split into chunks</text><path d="M580 211h40" stroke="#4c8b77" stroke-width="2"/><path d="m612 205 8 6-8 6" fill="none" stroke="#79c3a8"/><circle r="3" fill="#00ffcc"><animateMotion dur="2.8s" repeatCount="indefinite" path="M580 211h40"/></circle><rect x="330" y="131" width="250" height="164" rx="16" fill="#10231f" stroke="#315449"/><text x="350" y="165" font-size="13" fill="#00ffcc" font-weight="700">02</text><text x="350" y="202" font-size="16" fill="#e5f4ed" font-weight="700">VECTOR STORE</text><text x="350" y="238" font-size="15" fill="#a8bfb6" >Persist embeddings</text><text x="350" y="263" font-size="15" fill="#a8bfb6" >with LlamaIndex</text><path d="M870 211h40" stroke="#4c8b77" stroke-width="2"/><path d="m902 205 8 6-8 6" fill="none" stroke="#79c3a8"/><circle r="3" fill="#00ffcc"><animateMotion dur="2.8s" repeatCount="indefinite" path="M870 211h40"/></circle><rect x="620" y="131" width="250" height="164" rx="16" fill="#10231f" stroke="#315449"/><text x="640" y="165" font-size="13" fill="#00ffcc" font-weight="700">03</text><text x="640" y="202" font-size="16" fill="#e5f4ed" font-weight="700">QUESTION RETRIEVAL</text><text x="640" y="238" font-size="15" fill="#a8bfb6" >Find the top four</text><text x="640" y="263" font-size="15" fill="#a8bfb6" >matching passages</text><rect x="910" y="131" width="250" height="164" rx="16" fill="#10231f" stroke="#315449"/><text x="930" y="165" font-size="13" fill="#00ffcc" font-weight="700">04</text><text x="930" y="202" font-size="16" fill="#e5f4ed" font-weight="700">CONTEXT + ANSWER</text><text x="930" y="238" font-size="15" fill="#a8bfb6" >Send passages to GPT</text><text x="930" y="263" font-size="15" fill="#a8bfb6" >return answer + chunks</text><path d="M40 327H1160" stroke="#29463d"/><text x="40" y="366" font-size="14" fill="#a8bfb6" >INDEX FIRST / chunkSize 512 / chunkOverlap 128 / API port 4300</text></g></svg>
